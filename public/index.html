<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giriş | Collective Bucket</title>
  <meta name="description" content="Collective Bucket projeleri için merkezi giriş ve hesap oluşturma sayfası." />
  <script>
    (function () {
      try {
        var signOutRequested = new URLSearchParams(window.location.search).get("signOut") === "1";
        if (signOutRequested) {
          document.documentElement.setAttribute("data-cb-signout", "1");
        }
      } catch {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header data-cb-shell="header" data-cb-shell-app="Üye Girişi" data-cb-shell-home="/"></header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-heading">
        <img src="assets/logo.svg" alt="" />
        <div>
          <p class="eyebrow">Collective Bucket hesabı</p>
          <h1 id="auth-title">Giriş yap veya hesap oluştur</h1>
        </div>
      </div>

      <p class="intro">
        Bu oturum Collective Bucket altındaki projelerde ortak kullanılır.
      </p>

      <div id="form-panel">
        <form id="auth-form">
          <label for="email">E-posta</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required />
          <div class="inline-actions">
            <button id="forgot-password" class="text-button" type="button">Şifremi unuttum</button>
          </div>

          <div class="actions">
            <button id="sign-in" class="btn btn-primary" type="submit">Giriş Yap</button>
            <button id="sign-up" class="btn btn-ghost" type="button">Hesap Oluştur</button>
          </div>
          <div class="divider" aria-hidden="true"><span>veya</span></div>
          <button id="google-sign-in" class="btn btn-ghost btn-google" type="button">
            <span class="google-mark" aria-hidden="true">G</span>
            <span>Google ile devam et</span>
          </button>
        </form>
      </div>

      <div id="account-panel" class="account-panel" hidden>
        <p>Oturum açık:</p>
        <strong id="account-email"></strong>
        <button id="sign-out" class="btn btn-ghost" type="button">Çıkış Yap</button>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer data-cb-shell="footer"></footer>

  <script src="/client.js" defer></script>
  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script type="module" src="assets/auth.js"></script>
</body>
</html>
